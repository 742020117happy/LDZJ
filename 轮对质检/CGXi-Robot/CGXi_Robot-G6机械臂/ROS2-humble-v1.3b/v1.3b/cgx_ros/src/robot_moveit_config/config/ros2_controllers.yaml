# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    test_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster_1

test_group_controller:
  ros__parameters:
    joints:
      - G6_joint1
      - G6_joint2
      - G6_joint3
      - G6_joint4
      - G6_joint5
      - G6_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
